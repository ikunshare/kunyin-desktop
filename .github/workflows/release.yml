name: Release

on:
  push:
    tags:
      - 'v*'

# GITHUB_TOKEN 需要 contents:write 才能创建 Release 并上传资产与 latest*.yml
permissions:
  contents: write

jobs:
  # 先创建正式 Release（自动生成更新日志），随后 build 把安装包与更新元数据上传到该 Release。
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer & main
        run: npm run build

      # --publish always：electron-builder 向已创建的 Release 上传安装包 + latest*.yml（供 autoUpdater 检索）
      - name: Package & publish (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package & publish (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CI 无签名证书，跳过签名（notarize 已关）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package & publish (Linux)
        if: runner.os == 'Linux'
        # snap 需要 snapcraft（GitHub runner 无），CI 只出 AppImage + deb
        run: npx electron-builder --linux AppImage deb --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
