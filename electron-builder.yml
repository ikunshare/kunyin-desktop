appId: com.ikunshare.sound
productName: 坤音
directories:
  buildResources: build
# 只保留中英文 locale，其余 53 个 Chromium 语言包(~42M)不打包
electronLanguages:
  - zh-CN
  - en-US
afterPack: scripts/afterPack.js
files:
  # ⚠ 这些排除规则必须全部留在顶层，且 win/mac/linux 段里绝不能再出现 files 字段：
  # 一旦某平台定义了 files，electron-builder 组装应用主体的那套匹配规则
  # （firstOrDefaultFilePatterns）就只认平台级的，顶层这一整份会被静默忽略。
  # 1.0.5 就是这么把 .git(149M)、src、dist 一起打进 app.asar 的（173M）。
  # 平台相关的原生模块筛选改在 scripts/afterPack.js 里做。
  #
  # 另：这里只写排除模式。写「包含」模式（如 out/**）会污染收录生产依赖的那套规则，
  # 导致 node_modules 全量打包。
  #
  # glob 的 * 不跨 '/'：'!src/*' 只排除 src 的直接子项，src/main/index.ts 照样进包。
  # 因此目录一律用 '{,/**/*}'（目录本身 + 全部后代）。
  #
  # dist 必须显式排除：它装着上一次构建的安装包与 win-unpacked，
  # 漏掉就会把几百 MB 旧产物套娃打进新包（outDir 只在恰好等于 dist 时才自动排除）。
  - '!dist{,/**/*}'
  - '!dist-*{,/**/*}'
  - '!.git{,/**/*}'
  - '!src{,/**/*}'
  - '!docs{,/**/*}'
  - '!scripts{,/**/*}'
  - '!scripts-verify{,/**/*}'
  - '!tools{,/**/*}'
  # wasm crate 源码与 cargo 产物：编译结果已内联进 src/main/crypto/qmcWasmBinary.ts，
  # target/ 还动辄几百 MB，一律不进包
  - '!native{,/**/*}'
  - '!**/.vscode{,/**/*}'
  - '!*.tsbuildinfo'
  - '!tsconfig*.json'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  # better-sqlite3 瘦身：源码与本地 node-gyp 产物运行时都不加载（只用 prebuilds/ 下的 N-API 二进制）
  - '!node_modules/better-sqlite3/deps/**'
  - '!node_modules/better-sqlite3/src/**'
  - '!node_modules/better-sqlite3/build/**'
  # musl 版用不上：Electron 官方发行版依赖 glibc
  - '!node_modules/better-sqlite3/prebuilds/linuxmusl-*.node'
  # opencc-js 瘦身（5.9M → 0.2M）：主进程是 CJS，只 require dist/umd 下的那一个入口，
  # 且只做繁→简（见 providers/kg/lyric.ts 的 opencc-js/t2cn）。
  # esm/esm-lib 与 full/cn2t 的全量词典都用不上。
  - '!node_modules/opencc-js/dist/esm{,/**/*}'
  - '!node_modules/opencc-js/dist/esm-lib{,/**/*}'
  - '!node_modules/opencc-js/dist/umd/{full,cn2t}.js'
  # 图标：win/mac/linux 的 icon 配置是构建时从项目目录读的，不必进包。
  # 运行时用得上的只有托盘与缩略图工具栏那几张（见 out/main 里的 __dirname 引用）：
  # icon.ico / icon.png / 32x32.png / thumb-*.png，其余尺寸与 macOS 的 .icns 都是死重量。
  - '!resources/icons/icon.icns'
  - '!resources/icons/{16x16,24x24,48x48,64x64,128x128,256x256,512x512,1024x1024}.png'
asarUnpack:
  - resources/**
# 杜比软解链接了 LibreMPEG 的 AC-3 / E-AC-3 / AC-4 解码器（native/dolby-wasm，GPL-3.0+）：许可证全文随包分发，
# 「关于」页有署名与源码地址（见 native/dolby-wasm/README.md）。extraResources 不受上面 files 排除规则影响。
extraResources:
  - from: native/dolby-wasm/COPYING.GPLv3
    to: licenses/LibreMPEG-GPL-3.0.txt
win:
  executableName: kunyin-desktop
  icon: resources/icons/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  # 安装向导的用户协议页（内容为 MIT License，见 build/license.txt）
  license: build/license.txt
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  # 向导式安装：允许用户选择安装目录（非一键安装）
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 按用户安装，免管理员权限（默认 false，显式声明）
  perMachine: false
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico
  installerLanguages:
    - zh_CN
    - en_US
mac:
  # productName 是中文，而 zip target 默认模板带 ${productName}：落盘就成了「坤音-x.y.z-arm64-mac.zip」。
  # zip 本身上传时会按模板改名，但**它的 blockmap 直接用磁盘文件名**，electron-publish 拼上传 URL
  # 时不转义 →「Request path contains unescaped characters」，mac 任务从 v1.0.4 起就挂在这里，
  # 后续的 latest-mac.yml 也跟着传不上去（= macOS 自动更新一直不可用）。所以这里必须给出 ASCII 名。
  # dmg 有自己的 artifactName 覆盖，不受这条影响。
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  icon: resources/icons/icon.icns
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: ikunshare
  category: AudioVideo
  icon: resources/icons
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# 自动更新：electron-updater 从 GitHub Releases 拉取 latest*.yml
# 发布时由 CI（.github/workflows/release.yml）以 --publish always 上传安装包与更新元数据。
publish:
  provider: github
  owner: ikunshare
  repo: kunyin-desktop
  # 直接发布为正式 Release（默认是 draft，draft 不会被 autoUpdater 检索到）
  releaseType: release
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
